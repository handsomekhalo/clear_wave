name: Deploy
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          H: ${{ secrets.SERVER_HOST }}
          U: ${{ secrets.SERVER_USER }}
          K: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "host length: ${#H}"
          echo "user length: ${#U}"
          echo "key length: ${#K}"
