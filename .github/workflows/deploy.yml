name: Deploy
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 145.241.184.69
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: /home/ubuntu/deploy.sh
