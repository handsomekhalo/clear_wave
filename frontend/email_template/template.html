<!-- templates/emails/welcome_credentials.html -->
<!DOCTYPE html>
<html>
<body>
    <h2>Welcome to ClearWave, {{ user.first_name }}!</h2>
    
    <p>Your account has been created for <strong>{{ firm_name }}</strong>.</p>
    
    <p><strong>Login Details:</strong></p>
    <p>Email: {{ email }}</p>
    <p>Password: {{ password }}</p>
    
    <p>Login here: <a href="{{ login_url }}">{{ login_url }}</a></p>
    
    <p><em>Please change your password after first login.</em></p>
</body>
</html>
